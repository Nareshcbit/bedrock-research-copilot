# Re-runs the eval harness against live Bedrock once a week so we catch
# drift in model behavior, response shape, or deprecated model IDs before
# a reader does. Results land in evals/results/ (committed by a follow-up
# job we'll add in Module 07).
name: weekly-eval

on:
  schedule:
    # Mondays at 13:00 UTC.
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC role assumption
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # TODO: create an IAM role with a trust policy for GitHub OIDC
      # (token.actions.githubusercontent.com) and store its ARN in the
      # repo secret AWS_ROLE_ARN. Never use long-lived access keys here.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run eval harness
        run: python evals/harness.py
